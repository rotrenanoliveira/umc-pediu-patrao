<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Entregadores</title>
</head>

<body>
    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">
                <i class="bi bi-bicycle me-2 text-primary"></i>Entregadores
            </h2>
            <a href="/entregadores/novo" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Novo Entregador
            </a>
        </div>

        <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">Nome</th>
                            <th>Telefone</th>
                            <th>Veículo</th>
                            <th>Placa</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(entregadores)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                Nenhum entregador cadastrado.
                            </td>
                        </tr>
                        <tr th:each="entregador : ${entregadores}">
                            <td class="ps-4 fw-medium" th:text="${entregador.nome}">Nome</td>
                            <td th:text="${entregador.telefone} ?: '—'">Telefone</td>
                            <td th:text="${entregador.veiculo} ?: '—'">Veículo</td>
                            <td th:text="${entregador.placa} ?: '—'">Placa</td>
                            <td>
                                <span class="badge" th:classappend="${entregador.ativo} ? 'bg-success' : 'bg-secondary'"
                                    th:text="${entregador.ativo} ? 'Ativo' : 'Inativo'">
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/entregadores/editar/{id}(id=${entregador.id})}"
                                    class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil-fill"></i> Editar
                                </a>
                                <form th:action="@{/entregadores/deletar/{id}(id=${entregador.id})}" method="post"
                                    class="d-inline"
                                    onsubmit="return confirm('Deseja realmente excluir este entregador?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash-fill"></i> Excluir
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(entregadores)}">
                Total: <strong th:text="${#lists.size(entregadores)}"></strong> entregador(es)
            </div>
        </div>

    </div>
</body>

</html>
