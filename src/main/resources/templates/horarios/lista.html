<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Horário de Funcionamento</title>
</head>

<body>
    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">
                <i class="bi bi-clock me-2 text-primary"></i>Horário de Funcionamento
            </h2>
        </div>

        <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm" style="max-width: 820px;">
            <div class="card-body p-4">
                <p class="text-muted mb-4">
                    Defina os horários de abertura e fechamento para cada dia da semana.
                    Marque “Fechado” quando não houver atendimento.
                </p>

                <form th:action="@{/horarios/salvar}" th:object="${form}" method="post" id="formHorarios">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Dia</th>
                                    <th>Abertura</th>
                                    <th>Fechamento</th>
                                    <th class="text-center">Fechado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="horario, stat : *{horarios}">
                                    <td class="fw-medium">
                                        <input type="hidden" th:field="*{horarios[__${stat.index}__].id}" />
                                        <input type="hidden" th:field="*{horarios[__${stat.index}__].diaSemana}" />
                                        <input type="hidden" th:field="*{horarios[__${stat.index}__].ordem}" />
                                        <span th:text="${rotulos[horario.diaSemana]}">Dia</span>
                                    </td>
                                    <td>
                                        <input type="time" class="form-control hora-campo"
                                            th:field="*{horarios[__${stat.index}__].horaAbertura}"
                                            th:disabled="${horario.fechado}" />
                                    </td>
                                    <td>
                                        <input type="time" class="form-control hora-campo"
                                            th:field="*{horarios[__${stat.index}__].horaFechamento}"
                                            th:disabled="${horario.fechado}" />
                                    </td>
                                    <td class="text-center">
                                        <input type="checkbox" class="form-check-input check-fechado"
                                            th:field="*{horarios[__${stat.index}__].fechado}"
                                            th:attr="data-index=${stat.index}" />
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Salvar Horários
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            document.querySelectorAll('.check-fechado').forEach(function (checkbox) {
                checkbox.addEventListener('change', function () {
                    const row = this.closest('tr');
                    row.querySelectorAll('.hora-campo').forEach(function (input) {
                        input.disabled = checkbox.checked;
                        if (checkbox.checked) {
                            input.value = '';
                        }
                    });
                });
            });

            document.getElementById('formHorarios').addEventListener('submit', function () {
                document.querySelectorAll('.hora-campo').forEach(function (input) {
                    input.disabled = false;
                });
            });
        </script>

    </div>
</body>

</html>
