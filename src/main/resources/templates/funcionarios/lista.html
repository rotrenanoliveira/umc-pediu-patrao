<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Funcionários</title>
</head>

<body>
    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">
                <i class="bi bi-person-walking me-2 text-primary"></i>Funcionários
            </h2>
            <a href="/funcionarios/novo" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Novo Funcionário
            </a>
        </div>

        <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">Nome</th>
                            <th>Telefone</th>
                            <th>Cargo</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(funcionarios)}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                Nenhum funcionário cadastrado.
                            </td>
                        </tr>
                        <tr th:each="funcionario : ${funcionarios}">
                            <td class="ps-4 fw-medium" th:text="${funcionario.nome}">Nome</td>
                            <td th:text="${funcionario.telefone} ?: '—'">Telefone</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${funcionario.cargo}">Cargo</span>
                            </td>
                            <td>
                                <span class="badge"
                                    th:classappend="${funcionario.ativo} ? 'bg-success' : 'bg-secondary'"
                                    th:text="${funcionario.ativo} ? 'Ativo' : 'Inativo'">
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/funcionarios/editar/{id}(id=${funcionario.id})}"
                                    class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil-fill"></i> Editar
                                </a>
                                <form th:action="@{/funcionarios/deletar/{id}(id=${funcionario.id})}" method="post"
                                    class="d-inline"
                                    onsubmit="return confirm('Deseja realmente excluir este funcionário?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash-fill"></i> Excluir
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(funcionarios)}">
                Total: <strong th:text="${#lists.size(funcionarios)}"></strong> funcionário(s)
            </div>
        </div>

    </div>
</body>

</html>
