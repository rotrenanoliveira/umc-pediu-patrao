<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Funcionário</title>
</head>

<body>
    <div th:fragment="content">

        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="/funcionarios" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h2 class="fw-bold mb-0">
                <span th:text="${funcionario.id != null} ? 'Editar Funcionário' : 'Novo Funcionário'"></span>
            </h2>
        </div>

        <div class="card shadow-sm" style="max-width: 560px;">
            <div class="card-body p-4">
                <form th:action="${funcionario.id != null}
                        ? @{/funcionarios/editar/{id}(id=${funcionario.id})}
                        : @{/funcionarios/salvar}" th:object="${funcionario}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="nome" class="form-label fw-medium">
                            <i class="bi bi-person me-1"></i>Nome
                        </label>
                        <input type="text" id="nome" class="form-control" th:field="*{nome}"
                            placeholder="Ex: Maria Souza" required />
                    </div>

                    <div class="mb-3">
                        <label for="telefone" class="form-label fw-medium">
                            <i class="bi bi-telephone me-1"></i>Telefone
                        </label>
                        <input type="text" id="telefone" class="form-control" th:field="*{telefone}"
                            placeholder="Ex: (11) 99999-9999" required />
                    </div>

                    <div class="mb-3">
                        <label for="cargo" class="form-label fw-medium">
                            <i class="bi bi-briefcase me-1"></i>Cargo
                        </label>
                        <select id="cargo" class="form-select" th:field="*{cargo}" required>
                            <option value="" disabled>Selecione o cargo</option>
                            <option value="Atendente">Atendente</option>
                            <option value="Cozinheiro">Cozinheiro</option>
                            <option value="Pizzaiolo">Pizzaiolo</option>
                            <option value="Caixa">Caixa</option>
                            <option value="Gerente">Gerente</option>
                            <option value="Auxiliar">Auxiliar</option>
                        </select>
                    </div>

                    <div class="form-check mb-4">
                        <input type="checkbox" id="ativo" class="form-check-input" th:field="*{ativo}" />
                        <label for="ativo" class="form-check-label">Funcionário ativo</label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            <span
                                th:text="${funcionario.id != null} ? 'Salvar Alterações' : 'Criar Funcionário'"></span>
                        </button>
                        <a href="/funcionarios" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>

        <script>
            document.getElementById('telefone').addEventListener('input', function () {
                let v = this.value.replace(/\D/g, '');
                if (v.length <= 10) {
                    v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
                } else {
                    v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
                }
                this.value = v;
            });
        </script>

    </div>
</body>

</html>
